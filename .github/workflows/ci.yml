name: Continuous Integration

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ci:
    name: Lint, Test & Validate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
          pip install ".[dev]"

      - name: Code Quality & Linting (Ruff)
        run: |
          python -m ruff check .

      - name: Run Pytest Test Suite
        run: |
          pytest tests -v

      - name: Validate ML Model Artifacts & Inference
        run: |
          python scripts/validate_model.py

      - name: Validate Application Entry Points
        run: |
          python -c "from src.app import app; print('FastAPI app initialized successfully')"
          python -c "from app import create_app; flask_app = create_app({'TESTING': True}); print('Flask app initialized successfully')"
