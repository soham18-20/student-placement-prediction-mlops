name: MLOps Automated Model Retraining

on:
  schedule:
    # Trigger weekly on Sundays at midnight UTC
    - cron: '0 0 * * 0'
  workflow_dispatch:
    inputs:
      reason:
        description: 'Trigger reason (e.g. data drift detected, new semester cohort)'
        required: false
        default: 'Manual MLOps retrain trigger'

jobs:
  retrain-and-evaluate:
    name: Retrain Model & Validate Metrics
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Dependencies
        run: |
          pip install -r requirements.txt
          pip install pytest

      - name: Execute Model Retraining
        run: |
          python -m src.train

      - name: Validate New Model with Tests
        run: |
          pytest tests/test_model.py -v

      - name: Upload Retrained Model Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: retrained-model-artifacts
          path: models/
          retention-days: 14
