name: CI/CD Pipeline - Student Placement MLOps

on:
  push:
    branches: [ "main", "master", "develop" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  # -------------------------------------------------------------
  # STAGE 1: CONTINUOUS INTEGRATION (Linting, Testing, Validation)
  # -------------------------------------------------------------
  continuous-integration:
    name: Build, Lint & Unit Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Code Quality & Linting (Flake8)
        run: |
          # Stop build if there are Python syntax errors or undefined names
          flake8 src tests --count --select=E9,F63,F7,F82 --show-source --statistics
          # Exit-zero treats all warnings as non-fatal
          flake8 src tests --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics

      - name: Train Baseline Model
        run: |
          python -m src.train

      - name: Run Pytest Test Suite with Coverage
        run: |
          pytest tests -v --cov=src --cov-report=term-missing --cov-report=xml

      - name: Upload Test Coverage Artifact
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage.xml
          retention-days: 7

  # -------------------------------------------------------------
  # STAGE 2: CONTAINERIZATION (Docker Build & Verify)
  # -------------------------------------------------------------
  docker-build-and-verify:
    name: Docker Build & Smoke Test
    needs: continuous-integration
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          load: true
          tags: student-placement-mlops:ci-test

      - name: Container Smoke Test
        run: |
          docker run -d --name test_app -p 8000:8000 student-placement-mlops:ci-test
          sleep 6
          curl --fail http://localhost:8000/health || exit 1
          docker stop test_app

  # -------------------------------------------------------------
  # STAGE 3: CONTINUOUS DELIVERY (Deploy Simulation / Staging)
  # -------------------------------------------------------------
  continuous-delivery:
    name: Deploy to Production / Staging
    needs: [continuous-integration, docker-build-and-verify]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Log in to Docker Registry
        # In real production, set DOCKERHUB_USERNAME and DOCKERHUB_TOKEN in GitHub Repository Secrets
        if: "${{ env.DOCKERHUB_USERNAME != '' }}"
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          echo "$DOCKERHUB_TOKEN" | docker login -u "$DOCKERHUB_USERNAME" --password-stdin

      - name: Simulate Production Deployment & Health Verification
        run: |
          echo "======================================================="
          echo "🚀 Deploying Student Placement Prediction Service..."
          echo "🎯 Target Environment: Production (Kubernetes / Cloud Run)"
          echo "📦 Image: student-placement-mlops:v1.2"
          echo "✅ Smoke test verified and healthcheck passed"
          echo "======================================================="
