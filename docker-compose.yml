version: '3.8'

services:
  placement-api:
    build:
      context: .
      dockerfile: Dockerfile
    image: student-placement-mlops:latest
    container_name: placement_mlops_service
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - PORT=8000
      - PYTHONUNBUFFERED=1
    volumes:
      # Mount model artifacts and logs to host for persistence
      - ./models:/app/models
      - ./logs:/app/logs
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
