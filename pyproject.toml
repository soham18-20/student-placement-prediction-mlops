[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "student-placement-prediction-mlops"
version = "1.2.0"
description = "Student Placement Prediction System with MLOps"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "flask>=3.0.0",
    "gunicorn>=21.2.0",
    "scikit-learn>=1.4.0",
    "pandas>=2.2.0",
    "numpy>=1.26.0",
    "joblib>=1.3.2",
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.28.0",
    "pydantic>=2.6.0",
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.4.0",
    "pytest>=8.0.0",
    "pytest-cov>=4.1.0",
    "flake8>=7.0.0",
    "httpx>=0.27.0",
    "black>=24.2.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["src*", "app*", "ml*"]

[tool.ruff]
line-length = 127
target-version = "py311"
exclude = [
    ".git",
    ".pytest_cache",
    ".ruff_cache",
    ".venv",
    "venv",
    "__pycache__",
]

[tool.ruff.lint]
select = [
    "E9",   # Syntax errors and fatal pycodestyle
    "F63",  # Fatal pyflakes
    "F7",   # Syntax pyflakes
    "F82",  # Undefined names
    "E",    # Pycodestyle errors
    "W",    # Pycodestyle warnings
    "F",    # Pyflakes
]
ignore = [
    "E501",  # Line length handled by line-length = 127
    "E402",  # Module level import not at top of file (used in CLI scripts for sys.path)
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["F401", "F841"]
"__init__.py" = ["F401"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
filterwarnings = [
    "ignore::DeprecationWarning",
]
