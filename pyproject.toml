[tool.ruff]
line-length = 127
target-version = "py311"
exclude = [
    ".git",
    ".pytest_cache",
    ".ruff_cache",
    ".venv",
    "venv",
    "__pycache__",
]

[tool.ruff.lint]
select = [
    "E9",   # Syntax errors and fatal pycodestyle
    "F63",  # Fatal pyflakes
    "F7",   # Syntax pyflakes
    "F82",  # Undefined names
    "E",    # Pycodestyle errors
    "W",    # Pycodestyle warnings
    "F",    # Pyflakes
]
ignore = [
    "E501",  # Line length handled by line-length = 127
    "E402",  # Module level import not at top of file (used in CLI scripts for sys.path)
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["F401", "F841"]
"__init__.py" = ["F401"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
filterwarnings = [
    "ignore::DeprecationWarning",
]
